<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
<defs>
<linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
<stop offset="0%" stop-color="#7ba0a0"/><stop offset="46%" stop-color="#4b7070"/><stop offset="100%" stop-color="#1c2e2e"/></linearGradient>
<linearGradient id="glare" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#fff" stop-opacity=".20"/><stop offset="44%" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="pap" x1="0" y1="0" x2="0.3" y2="1">
<stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#ece8dc"/></linearGradient>
<linearGradient id="trace" x1="0" y1="0" x2="0.3" y2="1">
<stop offset="0%" stop-color="#fbf7ec"/><stop offset="100%" stop-color="#e7dfc9"/></linearGradient>
<linearGradient id="brassy" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#e2b86c"/><stop offset="100%" stop-color="#9a6f2c"/></linearGradient>
<linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#e3e8ec"/><stop offset="100%" stop-color="#9aa5ad"/></linearGradient>

</defs>
<rect width="1024" height="1024" fill="url(#tile)"/><rect width="1024" height="1024" fill="url(#glare)"/>
<ellipse cx="512" cy="900" rx="350" ry="30" fill="#000" opacity=".38"/>
<g transform="rotate(-3 510.0 500.0)"><rect x="200" y="220" width="620" height="560" rx="14" fill="#000" opacity=".35" transform="translate(12 16)"/><rect x="200" y="220" width="620" height="560" rx="14" fill="url(#trace)"/>
  <rect x="200" y="220" width="620" height="56" rx="14" fill="#4b7070"/>
  <rect x="200" y="260" width="620" height="16" fill="#4b7070"/>
  <rect x="240" y="310" width="300" height="14" rx="7" fill="#9aa4ac"/><rect x="240" y="352" width="460" height="14" rx="7" fill="#9aa4ac"/><rect x="240" y="394" width="380" height="14" rx="7" fill="#9aa4ac"/><rect x="240" y="436" width="420" height="14" rx="7" fill="#9aa4ac"/>
  <rect x="240" y="500" width="440" height="14" rx="7" fill="#9aa4ac"/><rect x="240" y="542" width="360" height="14" rx="7" fill="#9aa4ac"/><rect x="240" y="584" width="400" height="14" rx="7" fill="#9aa4ac"/>
  </g>
  <!-- three consultant marks, MEP / structural / civil, staggered like a real routing slip -->
  <g transform="rotate(8 420 640)">
    <circle cx="420" cy="640" r="72" fill="none" stroke="#5b7f96" stroke-width="10"/>
    <text x="420" y="652" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="34" font-weight="900" fill="#5b7f96">S</text>
  </g>
  <g transform="rotate(-6 560 610)">
    <circle cx="560" cy="610" r="72" fill="none" stroke="#c7865a" stroke-width="10"/>
    <text x="560" y="622" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="34" font-weight="900" fill="#c7865a">M</text>
  </g>
  <!-- the AHJ seal on top: approved for permit -->
  <g transform="rotate(-12 690 470)">
    <circle cx="690" cy="470" r="126" fill="#f7f3ea" stroke="#1c6b4a" stroke-width="12"/>
    <circle cx="690" cy="470" r="98" fill="none" stroke="#1c6b4a" stroke-width="5"/>
    <text x="690" y="456" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="900" fill="#1c6b4a" letter-spacing="3">APPROVED</text>
    <text x="690" y="500" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" fill="#1c6b4a" letter-spacing="4">FOR PERMIT</text>
    <path d="M 612 520 L 768 520" stroke="#1c6b4a" stroke-width="4"/>
  </g>

</svg>
