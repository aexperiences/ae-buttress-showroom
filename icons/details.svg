    <!-- brick veneer -->
    <rect x="326" y="232" width="60" height="26" rx="2" fill="#b86a4c" stroke="#3b3630" stroke-width="3"/><rect x="326" y="264" width="60" height="26" rx="2" fill="#b86a4c" stroke="#3b3630" stroke-width="3"/><rect x="326" y="296" width="60" height="26" rx="2" fill="#b86a4c" stroke="#3b3630" stroke-width="3"/><rect x="326" y="328" width="60" height="26" rx="2" fill="#b86a4c" stroke="#3b3630" stroke-width="3"/><rect x="326" y="360" width="60" height="26" rx="2" fill="#b86a4c" stroke="#3b3630" stroke-width="3"/><rect x="326" y="392" width="60" height="26" rx="2" fill="#b86a4c" stroke="#3b3630" stroke-width="3"/><rect x="326" y="424" width="60" height="26" rx="2" fill="#b86a4c" stroke="#3b3630" stroke-width="3"/><rect x="326" y="456" width="60" height="26" rx="2" fill="#b86a4c" stroke="#3b3630" stroke-width="3"/><rect x="326" y="488" width="60" height="26" rx="2" fill="#b86a4c" stroke="#3b3630" stroke-width="3"/><rect x="326" y="520" width="60" height="26" rx="2" fill="#b86a4c" stroke="#3b3630" stroke-width="3"/>
    <!-- sheathing + stud bay -->
    <rect x="392" y="220" width="48" height="340" fill="#e2cfa6" stroke="#3b3630" stroke-width="4"/>
    <rect x="440" y="220" width="56" height="340" fill="#fdfbf6" stroke="#3b3630" stroke-width="4"/>
    <path d="M 446 236 L 486 252 L 446 268" fill="none" stroke="#c9a25c" stroke-width="7" stroke-linecap="round"/><path d="M 446 268 L 486 284 L 446 300" fill="none" stroke="#c9a25c" stroke-width="7" stroke-linecap="round"/><path d="M 446 300 L 486 316 L 446 332" fill="none" stroke="#c9a25c" stroke-width="7" stroke-linecap="round"/><path d="M 446 332 L 486 348 L 446 364" fill="none" stroke="#c9a25c" stroke-width="7" stroke-linecap="round"/><path d="M 446 364 L 486 380 L 446 396" fill="none" stroke="#c9a25c" stroke-width="7" stroke-linecap="round"/><path d="M 446 396 L 486 412 L 446 428" fill="none" stroke="#c9a25c" stroke-width="7" stroke-linecap="round"/><path d="M 446 428 L 486 444 L 446 460" fill="none" stroke="#c9a25c" stroke-width="7" stroke-linecap="round"/><path d="M 446 460 L 486 476 L 446 492" fill="none" stroke="#c9a25c" stroke-width="7" stroke-linecap="round"/><path d="M 446 492 L 486 508 L 446 524" fill="none" stroke="#c9a25c" stroke-width="7" stroke-linecap="round"/><path d="M 446 524 L 486 540 L 446 556" fill="none" stroke="#c9a25c" stroke-width="7" stroke-linecap="round"/>
    <!-- interior gyp -->
    <rect x="496" y="220" width="18" height="340" fill="#f4eede" stroke="#3b3630" stroke-width="4"/>
    <!-- dimension across -->
    <path d="M 326 196 L 514 196" stroke="#c9a25c" stroke-width="5"/><path d="M 326 186 L 326 206 M 514 186 L 514 206" stroke="#c9a25c" stroke-width="5"/>
  </g>
  <circle cx="420" cy="520" r="250" fill="none" stroke="#3b3630" stroke-width="12"/>
  <circle cx="420" cy="520" r="270" fill="none" stroke="#c9c2b5" stroke-width="10"/>
  <!-- loupe handle -->
  <path d="M 612 712 L 720 820" stroke="#3b3630" stroke-width="44" stroke-linecap="round"/>
  <path d="M 612 712 L 720 820" stroke="#c9a25c" stroke-width="24" stroke-linecap="round"/>
  
</svg>
