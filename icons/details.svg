    <line x1="160" y1="560" x2="200" y2="600" stroke="#3b3630" stroke-width="4"/><line x1="186" y1="560" x2="226" y2="600" stroke="#3b3630" stroke-width="4"/><line x1="212" y1="560" x2="252" y2="600" stroke="#3b3630" stroke-width="4"/><line x1="238" y1="560" x2="278" y2="600" stroke="#3b3630" stroke-width="4"/><line x1="264" y1="560" x2="304" y2="600" stroke="#3b3630" stroke-width="4"/><line x1="290" y1="560" x2="330" y2="600" stroke="#3b3630" stroke-width="4"/><line x1="316" y1="560" x2="356" y2="600" stroke="#3b3630" stroke-width="4"/><line x1="342" y1="560" x2="382" y2="600" stroke="#3b3630" stroke-width="4"/><line x1="368" y1="560" x2="408" y2="600" stroke="#3b3630" stroke-width="4"/><line x1="394" y1="560" x2="434" y2="600" stroke="#3b3630" stroke-width="4"/><line x1="420" y1="560" x2="460" y2="600" stroke="#3b3630" stroke-width="4"/><line x1="446" y1="560" x2="486" y2="600" stroke="#3b3630" stroke-width="4"/><line x1="472" y1="560" x2="512" y2="600" stroke="#3b3630" stroke-width="4"/><line x1="498" y1="560" x2="538" y2="600" stroke="#3b3630" stroke-width="4"/><line x1="524" y1="560" x2="564" y2="600" stroke="#3b3630" stroke-width="4"/>
    <!-- slab -->
