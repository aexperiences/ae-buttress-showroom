  <rect x="260" y="520" width="110" height="60" rx="6" fill="#c9a25c" stroke="#8f6a2a" stroke-width="4"/><rect x="400" y="520" width="110" height="60" rx="6" fill="#c9a25c" stroke="#8f6a2a" stroke-width="4"/><rect x="260" y="660" width="110" height="60" rx="6" fill="#c9a25c" stroke="#8f6a2a" stroke-width="4"/><rect x="400" y="660" width="110" height="60" rx="6" fill="#c9a25c" stroke="#8f6a2a" stroke-width="4"/>
  <circle cx="315" cy="610" r="16" fill="#7d8288"/><circle cx="455" cy="610" r="16" fill="#7d8288"/><circle cx="315" cy="750" r="16" fill="#7d8288"/><circle cx="455" cy="750" r="16" fill="#7d8288"/>
  <!-- conference table -->
  <rect x="580" y="280" width="170" height="90" rx="45" fill="#5b7f96" stroke="#34546a" stroke-width="4"/>
